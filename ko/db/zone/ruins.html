<script>
document.querySelectorAll('[data-filter]').forEach(function(inp){var tbl=document.getElementById(inp.dataset.filter);if(!tbl)return;
 var sel=document.querySelector('[data-filter-sel="'+inp.dataset.filter+'"]');
 function run(){var q=inp.value.toLowerCase().trim();var k=sel?sel.value:'';var n=0;
  tbl.querySelectorAll('[data-row]').forEach(function(r){var ok=(!q||r.dataset.row.toLowerCase().indexOf(q)>=0)&&(!k||r.dataset.kind==k);r.style.display=ok?'':'none';if(ok)n++;});
  var c=document.getElementById(inp.dataset.filter+'-count');if(c)c.textContent=n;}
 inp.addEventListener('input',run);if(sel)sel.addEventListener('change',run);run();});
